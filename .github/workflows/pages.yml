# The website on GitHub Pages (https://richardedens.github.io/crissp/), built from site/ and crissp/look.
# Once: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "crissp/look/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: bash site/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@v5
