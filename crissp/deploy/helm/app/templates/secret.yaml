{{- /* Values from deploy.sh win; without one, the value already in the cluster is kept (an upgrade never wipes a secret). */}}
{{- $name := printf "%s-secret" .Release.Name }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $keys := dict }}
{{- range .Values.secretKeys }}{{ $_ := set $keys . "" }}{{ end }}
{{- if .Values.database.enabled }}{{ $_ := set $keys .Values.database.passwordKey "" }}{{ end }}
{{- range $k, $v := .Values.secrets }}{{ $_ := set $keys $k ($v | toString) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := $keys }}
  {{- if $v }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- else if and $old (index $old.data $k) }}
  {{ $k }}: {{ index $old.data $k | quote }}
  {{- else }}
  {{ $k }}: ""
  {{- end }}
  {{- end }}
