# Mistral Vibe: the crissp MCP server — the same tools .mcp.json gives Claude Code (brief, backlog, finding,
# decision, epic, feature, item, run, status, dashboard), pinned to this project's crissp.
# Written for this machine by `crissp init` and `crissp repair --yes` (F-100): Vibe's desktop app starts MCP servers
# from its own folder with only a few safe variables, so the project's folder is named here (cwd, CRISSP_ROOT) and
# the command is found by its full path. Not in git: a teammate's `crissp repair --yes` writes their own.
# Vibe loads project-local config only in trusted folders; init asks to add this project to trusted_folders.toml
# under VIBE_HOME (else ~/.vibe), repair adds it. Restart Vibe after a change: it reads this file per session.
[[mcp_servers]]
name = "crissp"
transport = "stdio"
command = {{VIBE_COMMAND}}
args = {{VIBE_ARGS}}
cwd = {{VIBE_ROOT}}
startup_timeout_sec = 60

[mcp_servers.env]
CRISSP_ROOT = {{VIBE_ROOT}}
