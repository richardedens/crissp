# crissp's own Semgrep rules for JavaScript and TypeScript, JSX included (lib/audit.py sast). ERROR blocks a release;
# WARNING is listed for review. Each rule has its tests in tests/javascript.jsx; semgrep --test runs them.
rules:
  - id: crissp-js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval, new Function or a timer given a string runs whatever that value holds.
    pattern-either:
      - patterns:
          - pattern: eval($X)
          - pattern-not: eval("...")
      - pattern: new Function(...)
      - patterns:  # a function given to a timer is fine; a string is code the page evals
          - pattern-either:
              - pattern: $TIMER("..." + $X, ...)
              - pattern: $TIMER("..." + $X + "...", ...)
              - pattern: $TIMER(`...`, ...)
              - pattern: $TIMER("...", ...)
          - metavariable-regex:
              metavariable: $TIMER
              regex: ^(setTimeout|setInterval)$

  - id: crissp-js-html-injection
    languages: [javascript, typescript]
    severity: WARNING
    message: HTML built from a value is put into the page (cross-site scripting). Set textContent, or escape every value.
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: $EL.insertAdjacentHTML($P, $X)
          - pattern: document.write($X)
          - pattern: document.writeln($X)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: $EL.insertAdjacentHTML($P, "...")
      - pattern-not: document.write("...")

  - id: crissp-react-dangerous-html
    languages: [javascript, typescript]
    severity: WARNING
    message: dangerouslySetInnerHTML puts HTML into the page unescaped. Sanitise it first, or render the text.
    pattern: <$EL dangerouslySetInnerHTML={$X} />

  - id: crissp-js-shell
    languages: [javascript, typescript]
    severity: ERROR
    message: A shell runs a command built from a value (shell injection). Use execFile or spawn with a list of arguments.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  import { $F } from "=~/^(node:)?child_process$/";
                  ...
              - pattern: $F($CMD, ...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import * as $CP from "=~/^(node:)?child_process$/";
                      ...
                  - pattern-inside: |
                      import $CP from "=~/^(node:)?child_process$/";
                      ...
                  - pattern-inside: |
                      $CP = require("=~/^(node:)?child_process$/");
                      ...
              - pattern: $CP.$F($CMD, ...)
          - pattern: require("=~/^(node:)?child_process$/").$F($CMD, ...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(exec|execSync)$
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: '"..."'

  - id: crissp-js-tls-off
    languages: [javascript, typescript]
    severity: ERROR
    message: The TLS certificate is not checked, so anyone in between can read and change the traffic.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
