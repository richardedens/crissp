<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UX suite</title>
  <script src="../../look/look.js"></script>
  <link rel="stylesheet" href="../../look/look.css">
  <link rel="stylesheet" href="ux.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">C</span><div><h1>UX suite</h1><p id="stamp">—</p></div></div>
    <nav class="sections" aria-label="Sections" data-current="ux"></nav>
    <nav id="tabs" class="tabs" role="tablist"></nav>
    <button id="theme" class="ghost" title="Light / dark" aria-label="Light or dark">◐</button>
  </header>
  <main id="view"><div class="card">Loading…</div></main>
  <dialog id="why"><form method="dialog"><h3 id="why-title">Why?</h3><p class="small muted" id="why-hint"></p>
    <textarea id="why-text" aria-label="Your reason"></textarea>
    <div class="toolbar" style="margin:10px 0 0"><button class="primary" value="ok">Save</button><button class="ghost" value="cancel">Cancel</button></div></form></dialog>
  <dialog id="viewer" class="viewer" aria-label="Enlarged view"><div class="viewer-bar"><b id="viewer-title"></b>
    <span class="seg" id="viewer-modes" role="group" aria-label="What to show"></span>
    <span class="seg" role="group" aria-label="Zoom"><button class="ghost small" data-zoom="fit">Fit</button><button class="ghost small" data-zoom="1">100%</button><button class="ghost small" data-zoom="1.5">150%</button><button class="ghost small" data-zoom="2">200%</button></span>
    <form method="dialog"><button class="ghost" aria-label="Close (Esc)">Close ✕</button></form></div>
    <div id="viewer-body" class="viewer-body"></div></dialog>
  <script src="ux.js"></script>
  <script src="../../look/water.js"></script>
</body>
</html>
