[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crissp"
dynamic = ["version"]
description = "C.R.I.S.S.P.: a way of working for a product owner, Claude and its agents in one repository, with the guards that prove it"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "crissp/look/LICENSE-figtree.txt"]
authors = [{ name = "Richard Edens" }]
requires-python = ">=3.12"
dependencies = []  # the engine is standard library only
keywords = ["claude", "claude-code", "mcp", "agents", "tdd", "release-gate", "backlog", "way-of-working"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/richardedens/crissp"
Source = "https://github.com/richardedens/crissp"
Issues = "https://github.com/richardedens/crissp/issues"
Changelog = "https://github.com/richardedens/crissp/blob/main/CHANGELOG.md"

[project.scripts]
crissp = "crissp.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>[^\\s]+)"

# The wheel: the crissp package (src/crissp) and, under crissp/engine/, the framework a project runs: the guards, the
# crissp tool, the testsuite and uxsuite engines, the shared look, the deploy template and the project template.
# Never this repository's own data (its agreement, backlog, configuration, results) and never the engine's own tests.
[tool.hatch.build.targets.wheel]
only-include = [
  "src/crissp",
  "crissp/CRISSP.md",
  "crissp/check.sh",
  "crissp/check-all.sh",
  "crissp/test.sh",
  "crissp/ux.sh",
  "crissp/deploy.sh",
  "crissp/tool",
  "crissp/look",
  "crissp/template",
  "crissp/testsuite/lib",
  "crissp/testsuite/dashboard",
  "crissp/testsuite/sast",
  "crissp/testsuite/frontend-lint",
  "crissp/testsuite/run.sh",
  "crissp/testsuite/setup.sh",
  "crissp/testsuite/requirements.txt",
  "crissp/testsuite/README.md",
  "crissp/uxsuite",
  "crissp/deploy",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/results",
  "crissp/uxsuite/tests",
  "crissp/testsuite/sast/tests",
  "crissp/uxsuite/team.json",
  "crissp/uxsuite/walks",
  "crissp/uxsuite/personas",
  "crissp/uxsuite/rules",
  "crissp/testsuite/dashboard/data.js",
  "**/.DS_Store",
]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"crissp" = "crissp/engine"

[tool.hatch.build.targets.sdist]
only-include = ["src", "crissp", "LICENSE", "NOTICE", "VERSION", "README.md", "CHANGELOG.md", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc", "**/results", "crissp/testsuite/dashboard/data.js", "**/.DS_Store"]

# crissp's own Python standard (the `python-lint` step in crissp/testsuite/suites.json, also in CI and before every
# commit): the ruff pinned in crissp/testsuite/requirements.txt, over src/, crissp/ and site/. The rules live here, not in
# the step, so an editor, a hand-run `ruff check`, Claude and Vibe give the answer the step gives (F-92).
[tool.ruff]
target-version = "py312"
line-length = 120
# crissp's Semgrep rules' tests: unsafe code on purpose (each line must or must not match a rule)
extend-exclude = ["crissp/testsuite/sast/tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle, line length included
  "F",        # pyflakes
  "B",        # bugbear: likely bugs
  "S",        # bandit: security
  "SIM",      # simpler forms
  "I",        # import order
  "N",        # names
  "UP",       # Python 3.12 forms
  "C4",       # comprehensions
  "RUF",      # ruff's own: RUF043 (an ambiguous pytest.raises pattern, F-90), RUF100 (a noqa that suppresses nothing)
  "PLW1510",  # subprocess.run says whether a non-zero exit is an error (check=True or check=False)
  "D100",     # every module says what it is
]
ignore = [
  "S603", "S607",  # the guards run git, bash and helm by design, as argument lists; a shell (S602) stays forbidden
  "E501",  # line length: comes with the one layout pass (ruff format), which waits until the open pull requests are in
]
# crissp's messages use typographic dashes and the multiplication sign on purpose
allowed-confusables = ["–", "×"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixed throwaway secrets, paths and addresses, open their own local servers and import after their
# sys.path setup. The uxsuite's tests import the `product` fixture from ux_kit and ask for it by name (F811): pytest's way.
"**/tests/*" = ["S101", "S104", "S105", "S106", "S108", "S310", "E402", "F811"]
"**/package_tests/*" = ["S101", "S104", "S105", "S106", "S108", "S310", "E402"]

[tool.ruff.lint.pycodestyle]
max-line-length = 130  # code is held at 120; a docstring, comment or message may run a little longer

# The python-lint step's duplicate-code check (crissp/testsuite/lint/python_lint.py, F-93): pylint's R0801 alone, six
# similar lines or more, over the same Python as ruff. Here, so a hand-run pylint gives the step's answer.
[tool.pylint."messages control"]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 6

[tool.pylint.reports]
score = false
